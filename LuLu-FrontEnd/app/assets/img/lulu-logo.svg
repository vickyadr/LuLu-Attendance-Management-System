<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.55" stop-color="#047857"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="rgba(167,243,208,0.22)" stroke-width="1.2"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <mask id="glyphMask">
      <rect width="512" height="512" fill="black"/>
      <g fill="none" stroke="white" stroke-width="26"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M150 150 V336 H254"/>
        <path d="M282 200 V382 H386"/>
      </g>
    </mask>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="118" cy="120" r="130" fill="rgba(34,197,94,0.22)"/>
    <circle cx="404" cy="404" r="140" fill="rgba(132,204,22,0.16)"/>
    <!-- grid ABOVE the glow circles so contrast stays even across the tile -->
    <rect width="512" height="512" fill="url(#grid)"/>

    <rect x="30" y="30" width="452" height="452" rx="88" ry="88"
          fill="none" stroke="rgba(167,243,208,0.35)" stroke-width="2.5"/>

    <rect width="512" height="512" fill="url(#glyph)" mask="url(#glyphMask)"/>

    <!-- lime node fully inside the joint -->
    <circle cx="282" cy="248" r="11" fill="#a3e635"/>
  </g>
</svg>
