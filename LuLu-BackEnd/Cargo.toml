[package]
name = "lulu_attendance-server"
version = "0.0.1"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
actix-web-httpauth = "0.8.3"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.0"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# runtime-tokio (not async-std) because actix-web runs on the tokio runtime
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid", "migrate"] }
uuid = { version = "1.27.0", features = ["serde", "v4"] }
ring = "0.17.14"
hex = "0.4"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
actix-ws = "0.4.0"
tokio = { version = "1.53.2", features = ["macros", "rt", "time", "sync"] }
futures-util = "0.3.34"
argon2 = "0.5.3"
